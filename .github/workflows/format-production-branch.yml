name: Format production branch

on:
  push:
    branches: [agent/production-hardening]

permissions:
  contents: write

concurrency:
  group: format-production-hardening
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          ref: agent/production-hardening

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Ruff
        run: python -m pip install "ruff==0.16.1"

      - name: Formatar arquivos
        run: python -m ruff format app cloud tests

      - name: Publicar formatacao
        run: |
          if git diff --quiet; then
            echo "Nenhuma mudança necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app cloud tests
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:agent/production-hardening

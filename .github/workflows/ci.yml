name: Validacao

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validacao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verificar estilo e erros estaticos
        run: python -m ruff check app cloud tests

      - name: Verificar formatacao
        run: python -m ruff format --check app cloud tests

      - name: Verificar dependencias
        run: python -m pip check

      - name: Compilar modulos
        run: python -m compileall -q app cloud tests

      - name: Executar testes
        env:
          ENABLE_TRANSCRIPTION: "false"
        run: python -m unittest discover -s tests -v

  cloud-smoke:
    name: Streamlit Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python do Streamlit Cloud
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias exatas da nuvem
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -m pip check

      - name: Abrir o entrypoint da nuvem
        env:
          ENABLE_TRANSCRIPTION: "false"
          ENABLE_PUBLIC_COLLECTION: "false"
          EPHEMERAL_MODE: "true"
        run: python -m unittest discover -s tests -p 'test_cloud_entrypoint.py' -v

      - name: Executar upload no painel de producao
        env:
          ENABLE_TRANSCRIPTION: "false"
          ENABLE_PUBLIC_COLLECTION: "false"
          EPHEMERAL_MODE: "true"
        run: python -m unittest discover -s tests -p 'test_dashboard_v3.py' -v

      - name: Confirmar modo raiz para embed do Community Cloud
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '^baseUrlPath' .streamlit/config.toml

  cloudflare-worker:
    name: Cloudflare Worker + D1 Free
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/cloudflare-memory

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Validar tipos e bundle do Worker
        run: npm run check

  cloudflare-app:
    name: Cloudflare Free Streamlit Embed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/cloudflare-app

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias do Worker
        run: npm install --no-audit --no-fund

      - name: Validar tipos e bundles de staging/producao
        run: npm run check && npm run check:staging

      - name: Garantir compatibilidade com Workers Free
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R '"containers"' wrangler.production.jsonc wrangler.staging.jsonc
          ! grep -R '"durable_objects"' wrangler.production.jsonc wrangler.staging.jsonc
          grep -F '"STREAMLIT_ORIGIN": "https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app"' wrangler.production.jsonc
          grep -F '"STREAMLIT_ORIGIN": "https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app"' wrangler.staging.jsonc
          grep -F 'streamlit-community-cloud-embed' src/index.ts

  production-runtime:
    name: Production Runtime Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Verificar UI e recursos ativos no Streamlit real
        env:
          TARGET_URL: https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import time

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1440,1400")

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(os.environ["TARGET_URL"])
              WebDriverWait(driver, 120).until(
                  lambda d: "Cole o link do post viral" in d.find_element(By.TAG_NAME, "body").text
              )
              time.sleep(4)
              body = driver.find_element(By.TAG_NAME, "body").text

              if "Estado do sistema" not in body:
                  for selector in (
                      '[data-testid="stSidebarCollapsedControl"] button',
                      '[data-testid="collapsedControl"] button',
                      'button[aria-label*="sidebar" i]',
                  ):
                      candidates = driver.find_elements(By.CSS_SELECTOR, selector)
                      if candidates:
                          try:
                              candidates[0].click()
                              time.sleep(2)
                              break
                          except Exception:
                              pass
                  body = driver.find_element(By.TAG_NAME, "body").text

              checks = {
                  "UI link-only": "Cole o link do post viral" in body and "Descobrir por que viralizou" in body,
                  "FFmpeg": "FFmpeg: disponível" in body,
                  "Apify": "Coleta pública: Apify + fallbacks" in body,
                  "Memória D1": "Memória longitudinal: cloudflare_d1" in body,
                  "IA multimodal": "IA multimodal:" in body and "IA multimodal: sem chave" not in body,
                  "Download automático": "Download automático da mídia" in body,
              }
              for label, ok in checks.items():
                  print(f"{label}: {'READY' if ok else 'MISSING'}")
              failed = [label for label, ok in checks.items() if not ok]
              if failed:
                  raise SystemExit("Runtime incompleto: " + ", ".join(failed))
          finally:
              driver.quit()
          PY

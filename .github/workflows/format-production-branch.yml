name: Manual formatting check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Ruff
        run: python -m pip install "ruff==0.16.1"

      - name: Verificar formatacao
        run: python -m ruff format --check app cloud tests

name: Autoformat Viral Intel 5

on:
  push:
    branches:
      - viral-intel-5-cutting-edge

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar branch V5
        uses: actions/checkout@v6
        with:
          ref: viral-intel-5-cutting-edge
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Ruff
        run: python -m pip install "ruff==0.16.4"

      - name: Aplicar formatacao oficial
        run: python -m ruff format app cloud tests

      - name: Commitar somente quando houver diferenca
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma formatacao pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app cloud tests
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:viral-intel-5-cutting-edge

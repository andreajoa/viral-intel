name: Cloudflare Free Production Activation

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-activate

permissions:
  contents: read
  issues: write

concurrency:
  group: viral-intel-cloudflare-free-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  VIRAL_INTEL_MEMORY_SECRET: ${{ secrets.VIRAL_INTEL_MEMORY_SECRET }}
  VIRAL_INTEL_APP_PASSWORD: ${{ secrets.VIRAL_INTEL_APP_PASSWORD }}

jobs:
  deploy:
    name: D1 Free -> embed staging -> /viral-intel
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Registrar inicio sanitizado da ativacao
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="Cloudflare activation started #${GITHUB_RUN_NUMBER}" \
            -f body="Automated sanitized start marker for the Viral Intel Cloudflare Free activation.\n\n- Status: **started**\n- Activation run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n- Run ID: \`${GITHUB_RUN_ID}\`\n- Commit: \`${GITHUB_SHA}\`\n- Branch: \`${GITHUB_REF_NAME}\`\n- Production target: \`https://andre-almeida.online/viral-intel/\`\n- Durable memory target: \`https://vi-memory.andre-almeida.online/health\`\n\nNo credential values are included in this report."

      - name: Baixar codigo validado
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar secrets obrigatorios sem exibir valores
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VIRAL_INTEL_MEMORY_SECRET VIRAL_INTEL_APP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name nao esta configurado como GitHub Secret."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "${#VIRAL_INTEL_MEMORY_SECRET}" -lt 24 ]; then
            echo "::error::VIRAL_INTEL_MEMORY_SECRET deve ter pelo menos 24 caracteres."
            exit 1
          fi
          if [ "${#VIRAL_INTEL_APP_PASSWORD}" -lt 16 ]; then
            echo "::error::VIRAL_INTEL_APP_PASSWORD deve ter pelo menos 16 caracteres."
            exit 1
          fi

      - name: Registrar baseline do website ao vivo
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --location --silent --show-error --output /tmp/site-before.html --write-out '%{http_code}' --max-time 30 https://andre-almeida.online/)
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ] || [ ! -s /tmp/site-before.html ]; then
            echo "::error::Website principal nao esta saudavel antes do deploy: HTTP $code"
            exit 1
          fi
          sha=$(sha256sum /tmp/site-before.html | awk '{print $1}')
          bytes=$(wc -c </tmp/site-before.html | tr -d ' ')
          echo "SITE_BEFORE_SHA=$sha" >> "$GITHUB_ENV"
          echo "SITE_BEFORE_BYTES=$bytes" >> "$GITHUB_ENV"

      - name: Instalar Wrangler da memoria
        working-directory: infra/cloudflare-memory
        run: npm install --no-audit --no-fund

      - name: Criar ou reutilizar D1 Free e gerar config runtime
        working-directory: infra/cloudflare-memory
        shell: bash
        run: |
          set -euo pipefail
          list_db() {
            npx wrangler d1 list --json | python -c 'import json,sys; rows=json.load(sys.stdin); print(next(((r.get("uuid") or r.get("id") or "") for r in rows if r.get("name")=="viral-intel-memory"), ""))'
          }
          DB_ID=$(list_db)
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create viral-intel-memory --location=enam
            DB_ID=$(list_db)
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::Nao foi possivel resolver o UUID do D1 viral-intel-memory."
            exit 1
          fi
          python - "$DB_ID" <<'PY'
          from pathlib import Path
          import sys
          db_id = sys.argv[1]
          source = Path("wrangler.production.jsonc").read_text()
          placeholder = "00000000-0000-0000-0000-000000000000"
          if placeholder not in source:
              raise SystemExit("placeholder do database_id nao encontrado")
          Path("wrangler.runtime.jsonc").write_text(source.replace(placeholder, db_id))
          PY

      - name: Preparar segredo HMAC da memoria
        working-directory: infra/cloudflare-memory
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          with open('.memory-secrets.json', 'w') as f:
              json.dump({'API_SECRET': os.environ['VIRAL_INTEL_MEMORY_SECRET']}, f)
          PY
          chmod 600 .memory-secrets.json

      - name: Publicar Worker D1 Free e aplicar migrations
        working-directory: infra/cloudflare-memory
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.runtime.jsonc --secrets-file .memory-secrets.json
          npx wrangler d1 migrations apply viral-intel-memory --remote --config wrangler.runtime.jsonc
          rm -f .memory-secrets.json

      - name: Validar memoria persistente
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 https://vi-memory.andre-almeida.online/health | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Worker de memoria nao ficou saudavel."
            exit 1
          fi

      - name: Instalar Wrangler do Worker Free
        working-directory: infra/cloudflare-app
        run: npm install --no-audit --no-fund

      - name: Preparar senha do Worker sem imprimir valor
        working-directory: infra/cloudflare-app
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          with open('.app-secrets.json', 'w') as f:
              json.dump({'VIRAL_INTEL_BASIC_PASSWORD': os.environ['VIRAL_INTEL_APP_PASSWORD']}, f)
          PY
          chmod 600 .app-secrets.json

      - name: Publicar staging Free isolado
        working-directory: infra/cloudflare-app
        run: npx wrangler deploy --config wrangler.staging.jsonc --secrets-file .app-secrets.json

      - name: Smoke test HTTP do staging
        shell: bash
        run: |
          set -euo pipefail
          EDGE="https://viral-intel-staging.andre-almeida.online/viral-intel/_edge-health"
          APP="https://viral-intel-staging.andre-almeida.online/viral-intel/_stcore/health"
          PAGE="https://viral-intel-staging.andre-almeida.online/viral-intel/"
          ok=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 "$EDGE" | grep -q '"ok":true'; then
              if curl --fail --silent --show-error --max-time 30 --user "andre:${VIRAL_INTEL_APP_PASSWORD}" "$APP" >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Staging Free nao ficou saudavel; producao NAO sera promovida."
            exit 1
          fi
          unauth=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$PAGE")
          if [ "$unauth" != "401" ]; then
            echo "::error::Staging nao esta protegido: HTTP $unauth"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --user "andre:${VIRAL_INTEL_APP_PASSWORD}" "$PAGE" >/tmp/viral-intel-staging.html
          test -s /tmp/viral-intel-staging.html
          grep -q 'viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app' /tmp/viral-intel-staging.html
          grep -q 'embed=true' /tmp/viral-intel-staging.html

      - name: Testar origin e WebSocket nativos do Streamlit
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app"
          curl --fail --silent --show-error --max-time 30 "https://${ORIGIN}/_stcore/health" >/dev/null
          curl --fail --silent --show-error --max-time 30 "https://${ORIGIN}/?embed=true" >/tmp/viral-intel-origin.html
          test -s /tmp/viral-intel-origin.html
          python -m pip install --quiet websocket-client
          python - <<'PY'
          import websocket
          origin = 'viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app'
          ws = websocket.create_connection(
              f'wss://{origin}/_stcore/stream',
              timeout=30,
              origin=f'https://{origin}',
          )
          ws.close()
          PY

      - name: Confirmar homepage identica antes da promocao
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://andre-almeida.online/ >/tmp/site-pre-promote.html
          current_sha=$(sha256sum /tmp/site-pre-promote.html | awk '{print $1}')
          if [ "$current_sha" != "$SITE_BEFORE_SHA" ]; then
            echo "::error::A homepage mudou durante staging. Producao NAO sera promovida."
            exit 1
          fi

      - name: Promover somente /viral-intel no Workers Free
        working-directory: infra/cloudflare-app
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.jsonc --secrets-file .app-secrets.json
          rm -f .app-secrets.json

      - name: Validar producao e preservacao do website
        shell: bash
        run: |
          set -euo pipefail
          EDGE="https://andre-almeida.online/viral-intel/_edge-health"
          APP="https://andre-almeida.online/viral-intel/_stcore/health"
          PAGE="https://andre-almeida.online/viral-intel/"
          ok=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 "$EDGE" | grep -q '"ok":true'; then
              if curl --fail --silent --show-error --max-time 30 --user "andre:${VIRAL_INTEL_APP_PASSWORD}" "$APP" >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::A rota /viral-intel nao ficou saudavel."
            exit 1
          fi
          unauth=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$PAGE")
          if [ "$unauth" != "401" ]; then
            echo "::error::Producao nao esta protegida: HTTP $unauth"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --user "andre:${VIRAL_INTEL_APP_PASSWORD}" "$PAGE" >/tmp/viral-intel-production.html
          grep -q 'viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app' /tmp/viral-intel-production.html
          grep -q 'embed=true' /tmp/viral-intel-production.html
          curl --fail --silent --show-error --location --max-time 30 https://andre-almeida.online/ >/tmp/site-after.html
          after_sha=$(sha256sum /tmp/site-after.html | awk '{print $1}')
          after_bytes=$(wc -c </tmp/site-after.html | tr -d ' ')
          if [ "$after_sha" != "$SITE_BEFORE_SHA" ] || [ "$after_bytes" != "$SITE_BEFORE_BYTES" ]; then
            echo "::error::A homepage mudou apos a promocao."
            exit 1
          fi

      - name: Resumo final
        run: |
          echo "Cloudflare Workers Free ativo em https://andre-almeida.online/viral-intel/"
          echo "D1 Free ativo em https://vi-memory.andre-almeida.online/health"
          echo "Origin Streamlit: https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app/"
          echo "Modo: Streamlit Community Cloud embed oficial, protegido pela entrada Basic Auth do Worker no dominio personalizado."
          echo "IMPORTANTE: configure CLOUDFLARE_MEMORY_URL e CLOUDFLARE_MEMORY_SECRET nos Secrets do Streamlit para ativar memoria duravel no app Python."

name: One-shot Apify runtime check

on:
  push:
    branches:
      - ops-apify-runtime-check
    paths:
      - .github/workflows/apify-runtime-check-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apify-runtime-check-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check selenium
      - name: Inspect live Streamlit status
        env:
          TARGET_URL: https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By

          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1600,1400")

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(os.environ["TARGET_URL"])
              time.sleep(35)
              texts = []
              try:
                  texts.append(driver.find_element(By.TAG_NAME, "body").text)
              except Exception:
                  pass
              for frame in driver.find_elements(By.TAG_NAME, "iframe"):
                  try:
                      driver.switch_to.frame(frame)
                      time.sleep(1)
                      texts.append(driver.find_element(By.TAG_NAME, "body").text)
                  except Exception:
                      pass
                  finally:
                      driver.switch_to.default_content()

              combined = "\n".join(texts)
              status_lines = [
                  line.strip()
                  for line in combined.splitlines()
                  if any(
                      key in line
                      for key in (
                          "IA multimodal:",
                          "FFmpeg:",
                          "Coleta pública:",
                          "Download automático",
                          "Memória longitudinal:",
                      )
                  )
              ]
              apify_active = any("Coleta pública: Apify + fallbacks" in line for line in status_lines)
              memory_active = any(
                  "Memória longitudinal:" in line and "desativada" not in line for line in status_lines
              )
              lines = [
                  "SANITIZED_RUNTIME_STATUS",
                  f"APIFY_ACTIVE={'yes' if apify_active else 'no'}",
                  f"DURABLE_MEMORY_ACTIVE={'yes' if memory_active else 'no'}",
              ]
              lines.extend(status_lines)
              Path("/tmp/runtime-result.txt").write_text("\n".join(lines), encoding="utf-8")
          finally:
              driver.quit()
          PY
      - name: Print sanitized result
        run: cat /tmp/runtime-result.txt

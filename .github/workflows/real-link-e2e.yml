name: Real public link E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/real-link-e2e.yml

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check selenium
      - name: Check Cloudflare D1 memory health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://vi-memory.andre-almeida.online/health > /tmp/d1-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/d1-health.json").read_text())
          ok = bool(data.get("ok")) and data.get("service") == "viral-intel-memory"
          schema = str(data.get("schema_version") or "unknown")
          print(f"D1_HEALTH={'yes' if ok else 'no'}")
          print(f"D1_SCHEMA={schema}")
          if not ok or schema == "unknown":
              raise SystemExit("D1_HEALTH_FAILED")
          PY
      - name: Exercise live link-only pipeline
        env:
          TARGET_URL: https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app/
          TEST_POST_URL: https://www.instagram.com/reel/DSI7LxnEbrb/
        run: |
          python - <<'PY'
          import os
          import re
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By

          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1600,1800")

          driver = webdriver.Chrome(options=options)

          def form_ready():
              inputs = driver.find_elements(By.TAG_NAME, "input")
              buttons = driver.find_elements(By.TAG_NAME, "button")
              return bool(inputs) and any("Descobrir por que viralizou" in (b.text or "") for b in buttons)

          def enter_app_context():
              driver.switch_to.default_content()
              if form_ready():
                  return True
              frames = driver.find_elements(By.TAG_NAME, "iframe")
              for frame in frames:
                  try:
                      driver.switch_to.default_content()
                      driver.switch_to.frame(frame)
                      if form_ready():
                          return True
                  except Exception:
                      pass
              driver.switch_to.default_content()
              return False

          try:
              driver.get(os.environ["TARGET_URL"])
              deadline = time.time() + 150
              while time.time() < deadline:
                  if enter_app_context():
                      break
                  time.sleep(2)
              else:
                  driver.switch_to.default_content()
                  outer = driver.find_element(By.TAG_NAME, "body").text[:1000]
                  print("FORM_DEBUG_TITLE=" + driver.title)
                  print("FORM_DEBUG_OUTER=" + outer.replace("\n", " | "))
                  print("FORM_DEBUG_IFRAMES=" + str(len(driver.find_elements(By.TAG_NAME, "iframe"))))
                  raise SystemExit("FORM_NOT_READY")

              link_inputs = driver.find_elements(By.CSS_SELECTOR, 'input[aria-label="Link público"]')
              inputs = link_inputs or [item for item in driver.find_elements(By.TAG_NAME, "input") if item.is_displayed()]
              if not inputs:
                  raise SystemExit("LINK_INPUT_NOT_FOUND")
              inputs[0].clear()
              inputs[0].send_keys(os.environ["TEST_POST_URL"])

              for button in driver.find_elements(By.TAG_NAME, "button"):
                  if "Descobrir por que viralizou" in (button.text or ""):
                      driver.execute_script("arguments[0].scrollIntoView({block:'center'});", button)
                      button.click()
                      break
              else:
                  raise SystemExit("SUBMIT_BUTTON_NOT_FOUND")

              deadline = time.time() + 420
              body = ""
              while time.time() < deadline:
                  try:
                      body = driver.find_element(By.TAG_NAME, "body").text
                  except Exception:
                      if not enter_app_context():
                          time.sleep(2)
                          continue
                      body = driver.find_element(By.TAG_NAME, "body").text
                  if (
                      "Investigação concluída" in body
                      and "Prompt pronto para enviar a uma IA" in body
                  ):
                      break
                  if "Não foi possível investigar o link automaticamente" in body:
                      print("LIVE_E2E_ERROR_PRESENT=yes")
                      for line in body.splitlines():
                          if "Não foi possível investigar" in line or "RuntimeError" in line or "Detalhe:" in line:
                              print("ERROR_LINE=" + line[:800])
                      raise SystemExit("LIVE_ANALYSIS_FAILED")
                  time.sleep(4)
              else:
                  print("TIMEOUT_BODY_TAIL=" + " | ".join(body.splitlines()[-25:])[:1800])
                  raise SystemExit("LIVE_ANALYSIS_TIMEOUT")

              required = {
                  "collection": "1. O que foi extraído automaticamente",
                  "breakout": "2. É realmente um breakout?",
                  "viral_dna": "3. DNA do viral",
                  "piece": "4. Anatomia da peça",
                  "comments": "5. O que os comentários revelam",
                  "blueprint": "6. Blueprint para criar uma versão sua",
                  "ai_prompt": "Prompt pronto para enviar a uma IA",
              }
              print("LIVE_E2E_SUCCESS=yes")
              for key, text in required.items():
                  present = text in body
                  print(f"SECTION_{key.upper()}={'yes' if present else 'no'}")
                  if not present:
                      raise SystemExit("MISSING_SECTION_" + key.upper())

              apify_active = "Coleta pública: Apify + fallbacks" in body
              d1_active = "Memória longitudinal: cloudflare_d1" in body
              print(f"APIFY_RUNTIME_ACTIVE={'yes' if apify_active else 'no'}")
              print(f"D1_RUNTIME_ACTIVE={'yes' if d1_active else 'no'}")
              if not apify_active:
                  raise SystemExit("APIFY_RUNTIME_NOT_ACTIVE")
              if not d1_active:
                  raise SystemExit("D1_RUNTIME_NOT_ACTIVE")

              dom_text = driver.execute_script("return document.body.textContent || ''") or ""
              persistence_error = "persistência do DNA viral:" in dom_text
              print(f"PERSISTENCE_PROVIDER_ERROR={'yes' if persistence_error else 'no'}")
              if persistence_error:
                  raise SystemExit("D1_PERSISTENCE_PROVIDER_ERROR")

              lines = [line.strip() for line in body.splitlines() if line.strip()]
              for label in (
                  "Cobertura automática",
                  "Arquivos de mídia",
                  "Comentários coletados",
                  "Posts do criador",
                  "Veredito",
                  "Amostra do criador",
                  "Vs. mediana do criador",
              ):
                  try:
                      index = lines.index(label)
                  except ValueError:
                      continue
                  value = lines[index + 1] if index + 1 < len(lines) else ""
                  value = re.sub(r"[^0-9A-Za-zÀ-ÿ%.,× _-]", "", value)[:120]
                  print("METRIC_" + re.sub(r"[^A-Z0-9]+", "_", label.upper()).strip("_") + "=" + value)

              private_claims = (
                  "saves estimados",
                  "retenção estimada",
                  "alcance de não seguidores estimado",
                  "ranking weights descobertos",
              )
              fabricated = any(term.lower() in body.lower() for term in private_claims)
              print(f"UNSUPPORTED_PRIVATE_METRIC_CLAIMS={'yes' if fabricated else 'no'}")
              if fabricated:
                  raise SystemExit("UNSUPPORTED_PRIVATE_METRIC_CLAIMS")
          finally:
              driver.quit()
          PY

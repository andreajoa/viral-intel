name: Agent Autoformat

on:
  push:
    branches:
      - "agent/**"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Ruff
        run: python -m pip install "ruff>=0.16.0"

      - name: Formatar arquivos Python
        run: python -m ruff format app cloud tests

      - name: Publicar formatação quando necessária
        run: |
          if git diff --quiet; then
            echo "Nenhuma formatação pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app cloud tests
          git commit -m "style: apply ruff formatting"
          git push origin "HEAD:${{ github.ref_name }}"

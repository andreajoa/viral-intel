name: Validacao

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validacao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verificar estilo e erros estaticos
        run: python -m ruff check app tests

      - name: Verificar formatacao
        run: python -m ruff format --check app tests

      - name: Verificar dependencias
        run: python -m pip check

      - name: Compilar modulos
        run: python -m compileall -q app tests

      - name: Executar testes
        run: python -m unittest discover -s tests -v

name: One-shot production screenshot

on:
  push:
    branches:
      - ops-production-screenshot-e8cad8d9
    paths:
      - .github/workflows/production-screenshot-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-screenshot-once.yml

permissions:
  contents: read
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Capture production UI
        env:
          TARGET_URL: https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app/
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from selenium import webdriver
          from selenium.webdriver.common.by import By

          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1600,1400")

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(os.environ["TARGET_URL"])
              time.sleep(35)
              title = driver.title
              url = driver.current_url
              outer_body = driver.find_element(By.TAG_NAME, "body").text
              frames = driver.find_elements(By.TAG_NAME, "iframe")
              frame_data = []
              for index, frame in enumerate(frames):
                  src = frame.get_attribute("src") or ""
                  record = {"index": index, "src": src[:500], "body": ""}
                  try:
                      driver.switch_to.frame(frame)
                      time.sleep(2)
                      record["body"] = driver.find_element(By.TAG_NAME, "body").text[:12000]
                  except Exception as exc:
                      record["error"] = type(exc).__name__
                  finally:
                      driver.switch_to.default_content()
                  frame_data.append(record)

              payload = {
                  "title": title,
                  "url": url,
                  "outer_body": outer_body[:12000],
                  "frames": frame_data,
              }
              Path("runtime-ui.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              driver.save_screenshot("runtime-production.png")
              print("TITLE=" + title)
              print("IFRAMES=" + str(len(frames)))
              print("OUTER_BODY_CHARS=" + str(len(outer_body)))
          finally:
              driver.quit()
          PY

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-evidence
          path: |
            runtime-production.png
            runtime-ui.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/body.md <<EOF
          One-shot production runtime evidence is ready.

          - Run ID: \`${GITHUB_RUN_ID}\`
          - Commit under verification: \`e8cad8d9efc0371e808dd872a4b311c87120ff91\`
          - Target: \`https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app/\`
          - Artifact: \`production-runtime-evidence\`

          No credential values are intentionally collected by this diagnostic.
          EOF
          gh issue create --title "Production screenshot e8cad8d9 ready" --body-file /tmp/body.md

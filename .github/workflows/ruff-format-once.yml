name: One-shot Ruff formatter

on:
  push:
    branches:
      - link-only-viral-lab
    paths:
      - .github/workflows/ruff-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: link-only-viral-lab
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply canonical Ruff formatting
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.16.4"
          python -m ruff format app cloud tests

      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app cloud tests
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply canonical Ruff formatting"
            git push origin HEAD:link-only-viral-lab
          fi

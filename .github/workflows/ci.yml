name: Validacao

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validacao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verificar estilo e erros estaticos
        run: python -m ruff check app cloud tests

      - name: Verificar formatacao
        run: python -m ruff format --check app cloud tests

      - name: Verificar dependencias
        run: python -m pip check

      - name: Compilar modulos
        run: python -m compileall -q app cloud tests

      - name: Executar testes
        env:
          ENABLE_TRANSCRIPTION: "false"
        run: python -m unittest discover -s tests -v

  cloud-smoke:
    name: Streamlit Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python do Streamlit Cloud
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias exatas da nuvem
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud/requirements.txt
          python -m pip check

      - name: Abrir o entrypoint da nuvem
        env:
          ENABLE_TRANSCRIPTION: "false"
          ENABLE_PUBLIC_COLLECTION: "false"
          EPHEMERAL_MODE: "true"
        run: python -m unittest discover -s tests -p 'test_cloud_entrypoint.py' -v

      - name: Executar upload no painel de producao
        env:
          ENABLE_TRANSCRIPTION: "false"
          ENABLE_PUBLIC_COLLECTION: "false"
          EPHEMERAL_MODE: "true"
        run: python -m unittest discover -s tests -p 'test_dashboard_v3.py' -v

  cloudflare-worker:
    name: Cloudflare Worker + D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/cloudflare-memory

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Validar tipos e bundle do Worker
        run: npm run check

  cloudflare-app:
    name: Cloudflare Container App
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: infra/cloudflare-app

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias do gateway
        run: npm install --no-audit --no-fund

      - name: Validar tipos e bundle do gateway
        run: npm run check && npm run check:staging

      - name: Construir imagem real do Viral Intel
        run: docker build -f ../../Dockerfile.cloudflare -t viral-intel-cloudflare:test ../..

      - name: Subir container e validar base path do Streamlit
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name viral-intel-test -p 8080:8080 \
            -e CLOUDFLARE_MEMORY_URL=https://memory.invalid \
            -e CLOUDFLARE_MEMORY_SECRET=ci-memory-secret-with-24-chars \
            viral-intel-cloudflare:test

          ok=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/viral-intel/_stcore/health >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            docker logs viral-intel-test
            exit 1
          fi

          docker inspect --format='{{json .State.Health}}' viral-intel-test || true
          docker logs --tail 80 viral-intel-test

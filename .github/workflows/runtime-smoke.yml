name: Viral Intel production runtime smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: Live Streamlit Render Context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Locate Streamlit render context
        env:
          TARGET_URL: https://viral-intel-xcpaef9v2esxkyz5ifgvke.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By

          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1440,1200")
          driver = webdriver.Chrome(options=options)
          try:
              driver.get(os.environ["TARGET_URL"])
              time.sleep(25)
              print("LIVE_TITLE=", driver.title)
              print("LIVE_URL=", driver.current_url)
              frames = driver.find_elements(By.TAG_NAME, "iframe")
              print("IFRAME_COUNT=", len(frames))
              for index, frame in enumerate(frames):
                  print(f"IFRAME_{index}_SRC=", frame.get_attribute("src") or "")
                  print(f"IFRAME_{index}_TITLE=", frame.get_attribute("title") or "")
              body = driver.find_element(By.TAG_NAME, "body").text
              print("TOP_BODY_LENGTH=", len(body))
          finally:
              driver.quit()
          PY
